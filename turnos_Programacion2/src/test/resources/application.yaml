spring:
  datasource:
    url: jdbc:h2:mem:turnos_test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
app:
  security:
    jwt:
      secret: test-only-jwt-secret-at-least-32-bytes-long
      issuer: turnos-api
      expiration-seconds: 3600
    cors:
      allowed-origins: ""
